name: Publish sandbox egress proxy

on:
  push:
    branches: [main]
    paths:
      - 'infra/egress-proxy/**'
      - '.github/workflows/publish-egress-proxy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/egress-proxy/Dockerfile
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rafex/insightbloom-egress-proxy:latest
            ghcr.io/rafex/insightbloom-egress-proxy:build-${{ github.run_id }}
          cache-from: type=gha,scope=egress-proxy
          cache-to: type=gha,mode=max,scope=egress-proxy
