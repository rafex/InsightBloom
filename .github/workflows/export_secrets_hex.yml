name: Export Secrets as Hex (one-shot)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encode secrets byte by byte as hex
        run: |
          mkdir -p /tmp/hex
          encode() { echo -n "$2" | xxd -p | tr -d '\n' > "/tmp/hex/$1.hex"; }

          encode CHAT_SECRET_KEY       "${{ secrets.CHAT_SECRET_KEY }}"
          encode ETHERPAD_API_KEY      "${{ secrets.ETHERPAD_API_KEY }}"
          encode INTERNAL_API_KEY      "${{ secrets.INTERNAL_API_KEY }}"
          encode NATS_AUTH_TOKEN       "${{ secrets.NATS_AUTH_TOKEN }}"
          encode DEEPSEEK_API_KEY      "${{ secrets.DEEPSEEK_API_KEY }}"
          encode LLM_PROVIDER_API_KEY  "${{ secrets.LLM_PROVIDER_API_KEY }}"
          encode JAAS_API_KEY_ID       "${{ secrets.JAAS_API_KEY_ID }}"
          encode JAAS_APP_ID           "${{ secrets.JAAS_APP_ID }}"
          encode JAAS_PRIVATE_KEY      "${{ secrets.JAAS_PRIVATE_KEY }}"
          encode JAAS_PUBLIC_KEY       "${{ secrets.JAAS_PUBLIC_KEY }}"
          encode PASSWORD_ADMIN_USER   "${{ secrets.PASSWORD_ADMIN_USER }}"
          encode ZOHO_SMTP_PASSWORD    "${{ secrets.ZOHO_SMTP_PASSWORD }}"
          encode KUBE_CONFIG_DATA      "${{ secrets.KUBE_CONFIG_DATA }}"

      - name: Upload hex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secrets-hex
          path: /tmp/hex/
