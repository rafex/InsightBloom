---
name: Publish stats image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
    paths:
      - 'backend/services/insightbloom-stats/**'
      - 'backend/common/**'
      - 'backend/contracts/**'
      - 'pom.xml'
      - 'container/backend/java/Dockerfile'
      - '.github/workflows/publish-stats.yml'
      - '.github/workflows/_build-java-service.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de version para la imagen (formato vN.YYYYmmDD[-N], ej: v1.20260424 o v1.20260424-1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-java-service.yml
    with:
      service: insightbloom-stats
      port: '8085'
      version_tag: ${{ github.event.inputs.version_tag || '' }}
      event_name: ${{ github.event_name }}
      ref_type: ${{ github.ref_type }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
