---
# Imagenes de sandbox del IDE (TASK-0010/0011, Fase 3; Fase 4: split ide/runtime).
# Este workflow es solo CI (build + push a GHCR) -- no despliega a k3s, eso se hace
# aparte mediante FluxCD/ImageUpdateAutomation. Se ejecuta en cada push a main para
# que la imagen del IDE no quede anclada a un commit antiguo cuando cambia el codigo
# que la usa (por ejemplo, el flujo de publicacion o el contrato de sandbox). También se
# puede lanzar manualmente para refrescar OpenCode CLI aunque no haya cambios de código.
# Flux selecciona despues el tag build-* mas alto y lo fija en InsightBloom-gitops.
#
# Deliberadamente sigue independiente de los demas publish-*.yml: nada depende de el
# via `needs:`, y el tampoco es needs de nadie. Un fallo aca no debe impedir que las
# imagenes de los servicios de la aplicacion real queden publicadas en GHCR.
# Postmortem 2026-07-13: agregar este job al `needs:` de un deploy hizo que se saltara
# entero (incluyendo web/users ya compilados y listos) cuando el job fallo.
name: Publish code-ide images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
  workflow_dispatch:
    inputs:
      refresh_opencode:
        description: 'Descargar la release latest de OpenCode CLI e invalidar su capa de cache'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: rafex

jobs:
  test-node-types-seeder:
    name: Test global Node typings seeder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "25"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install isolated TypeScript config API
        run: npm install --prefix "$RUNNER_TEMP/insightbloom-tsconfig-api" --omit=dev --save-exact typescript@6.0.3

      - name: Test workspace seeding and safe cleanup
        env:
          INSIGHTBLOOM_TYPESCRIPT_API: ${{ runner.temp }}/insightbloom-tsconfig-api/node_modules/typescript/lib/typescript.js
        run: python -m unittest -v infra.docker.test_seed_node_types

      - name: Test OpenCode Web extension compatibility patch
        run: python -m unittest -v infra.docker.test_patch_opencode_vscode_extension

  build-and-push-code-ide:
    name: Build and push code-ide (${{ matrix.name }})
    needs: test-node-types-seeder
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cambio de paradigma 2026-07-17: tres imagenes autocontenidas (sin split ide/runtime,
          # ver KubernetesPodClient.java) -- cada una trae el toolchain completo (Java 25 Temurin,
          # Python 3.12, Node 24 LTS) adentro.
          - name: debian
            file: infra/docker/Dockerfile.code-ide-debian
            image: ghcr.io/rafex/insightbloom-code-ide-debian
            variantTag: latest
          - name: neovim
            file: infra/docker/Dockerfile.code-ide-neovim
            image: ghcr.io/rafex/insightbloom-code-ide-neovim
            variantTag: latest
          # Variante CLI opt-in (2026-07-26): Dockerfile.code-ide-neovim permanece intacto y
          # estable; LazyVim se publica en su propia imagen/tag para que el usuario elija.
          - name: neovim-lazyvim
            file: infra/docker/Dockerfile.code-ide-neovim-lazyvim
            image: ghcr.io/rafex/insightbloom-code-ide-neovim-lazyvim
            variantTag: latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          opencode_metadata="$(curl -fsSL https://opencode.ai/update/api/latest/cli/npm)"
          opencode_version="$(jq -er '.version' <<<"$opencode_metadata")"
          opencode_package="$(jq -er '.metadata.package' <<<"$opencode_metadata")"
          opencode_source_sha="$(jq -er '.metadata.github.sha' <<<"$opencode_metadata")"
          echo "OpenCode channel: $(jq -er '.channel' <<<"$opencode_metadata")"
          echo "OpenCode version: $opencode_version"
          echo "OpenCode package: $opencode_package"
          echo "OpenCode source SHA: $opencode_source_sha"
          {
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "opencode_version=$opencode_version"
            echo "opencode_package=$opencode_package"
            echo "opencode_source_sha=$opencode_source_sha"
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.refresh_opencode }}" == "true" ]]; then
            # Cada dispatch debe atravesar la capa de instalación para consultar latest.
            opencode_cache_bust="$GITHUB_RUN_ID"
          else
            # En builds automáticos, un commit nuevo también invalida esa capa.
            opencode_cache_bust="$GITHUB_SHA"
          fi
          echo "opencode_cache_bust=$opencode_cache_bust" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          build-args: |
            RUNTIME_GIT_SHA=${{ github.sha }}
            RUNTIME_BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OPENCODE_CACHE_BUST=${{ steps.metadata.outputs.opencode_cache_bust }}
            OPENCODE_VERSION=${{ steps.metadata.outputs.opencode_version }}
          tags: |
            ${{ matrix.image }}:${{ matrix.variantTag }}
            ${{ matrix.image }}:build-${{ github.run_id }}
          cache-from: type=gha,scope=code-ide-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=code-ide-${{ matrix.name }}
