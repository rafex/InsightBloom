---
# Imagenes de sandbox del IDE (TASK-0010/0011, Fase 3; Fase 4: split ide/runtime).
# Este workflow es solo CI (build + push a GHCR) -- no despliega a k3s, eso se hace
# aparte y manualmente contra el cluster. Deliberadamente independiente de los demas
# publish-*.yml: nada depende de el via `needs:`, y el tampoco es needs de nadie. Un
# fallo aca no debe impedir que las imagenes de los servicios de la aplicacion real
# queden publicadas en GHCR. Postmortem 2026-07-13: en un momento en que este pipeline
# si encadenaba un job de deploy, agregar este job al `needs:` de ese deploy hizo que
# se saltara entero (incluyendo web/users ya compilados y listos) porque este job
# fallo -- el precedente se mantiene como recordatorio de no volver a acoplarlo.
name: Publish code-ide images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
    paths:
      - 'infra/docker/Dockerfile.code-ide-debian'
      - 'infra/docker/Dockerfile.code-ide-neovim'
      - 'infra/docker/code-ide-settings.json'
      - 'infra/docker/code-ide-launch.json'
      - 'infra/docker/code-ide-entrypoint.sh'
      - 'infra/docker/runtime-*.sh'
      - 'infra/docker/nvim-init.lua'
      - 'infra/docker/sandbox-agent.py'
      - 'infra/docker/sandbox-file-agent.py'
      - 'infra/docker/sandbox_file_api.py'
      - '.github/workflows/publish-code-ide.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: rafex

jobs:
  build-and-push-code-ide:
    name: Build and push code-ide (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cambio de paradigma 2026-07-17: dos imagenes autocontenidas (sin split ide/runtime,
          # ver KubernetesPodClient.java) -- cada una trae el toolchain completo (Java 25 Temurin,
          # Python 3.12, Node 24 LTS) adentro.
          - name: debian
            file: infra/docker/Dockerfile.code-ide-debian
            image: ghcr.io/rafex/insightbloom-code-ide-debian
            variantTag: latest
          - name: neovim
            file: infra/docker/Dockerfile.code-ide-neovim
            image: ghcr.io/rafex/insightbloom-code-ide-neovim
            variantTag: latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          build-args: |
            RUNTIME_GIT_SHA=${{ github.sha }}
            RUNTIME_BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          tags: |
            ${{ matrix.image }}:${{ matrix.variantTag }}
            ${{ matrix.image }}:build-${{ github.run_id }}
          cache-from: type=gha,scope=code-ide-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=code-ide-${{ matrix.name }}
