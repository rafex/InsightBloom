name: Publish material cache
on:
  push:
    branches: [main]
    paths: [infra/docker/material-cache.py, infra/docker/Dockerfile.material-cache, .github/workflows/publish-material-cache.yml]
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.material-cache
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          tags: ghcr.io/rafex/insightbloom-material-cache:build-${{ github.run_id }},ghcr.io/rafex/insightbloom-material-cache:latest
          cache-from: type=gha,scope=material-cache
          cache-to: type=gha,mode=max,scope=material-cache
