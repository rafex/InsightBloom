---
name: Build and Publish Containers

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de version para la imagen (formato vN.YYYYmmDD[-N], ej: v1.20260424 o v1.20260424-1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: rafex

jobs:
  # ── Backend services (5 microservicios Java) ────────────────────────────────
  build-and-push-users:
    name: Build and push users
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate image tag
        id: image_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi
          if [ "${IMAGE_TAG}" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid tag format: $IMAGE_TAG"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Build Java services
        run: |
          # Usar mvn del sistema (actions/setup-java lo instala) para evitar
          # que mvnw intente descargar Maven desde repositorios externos
          mvn -DskipTests package -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push users
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/backend/java/Dockerfile
          build-args: |
            SERVICE=insightbloom-users
            SERVICE_PORT=8081
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-users:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-users:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-stats:
