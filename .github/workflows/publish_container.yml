            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish visibility note
        run: |
          echo "Images pushed to ghcr.io/${{ env.OWNER }}/insightbloom-*"
          echo "Tag: ${{ steps.image_tag.outputs.value }}"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy-after-publish:
    name: Deploy to k3s
    needs:
      - build-and-push-users
      - build-and-push-stats
      - build-and-push-moderation
      - build-and-push-query
      - build-and-push-ingest
      - build-and-push-chat
      - build-and-push-web
      - build-and-push-survey
      - build-and-push-presentations
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    uses: ./.github/workflows/deploy.yml
    with:
      version_tag: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
    secrets: inherit
