  # ── Sandbox IDE images (TASK-0010/0011, Fase 3; Fase 4: split ide/runtime) ──
  # Deliberadamente NO esta en el `needs:` de deploy-after-publish: un fallo aca
  # no debe bloquear el deploy de los servicios de la aplicacion real, que no
  # dependen de esta imagen para funcionar. Postmortem 2026-07-13: el primer
  # intento de agregarla a `needs:` hizo que "Deploy to k3s" se saltara entero
  # (incluyendo web/users ya compilados y listos) porque este job fallo.
  # Fase 4 (2026-07-14): se separo la imagen "ide" (Debian, solo code-server via
  # release standalone — sin npm) del "runtime" por variante (Alpine, solo
  # toolchain). Ninguna de las 4 imagenes depende de otra via FROM, asi que se
  # construyen en paralelo como matriz (antes era secuencial porque python/java/web
  # extendian FROM la imagen base).
  build-and-push-code-ide:
    name: Build and push code-ide (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ide-server
            file: infra/docker/Dockerfile.code-ide-server
            tag: ghcr.io/rafex/insightbloom-code-ide-server:latest
          - name: runtime-python
            file: infra/docker/Dockerfile.code-ide-runtime.python
            tag: ghcr.io/rafex/insightbloom-code-ide-runtime:python
          - name: runtime-java
            file: infra/docker/Dockerfile.code-ide-runtime.java
            tag: ghcr.io/rafex/insightbloom-code-ide-runtime:java
          - name: runtime-web
            file: infra/docker/Dockerfile.code-ide-runtime.web
            tag: ghcr.io/rafex/insightbloom-code-ide-runtime:web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=code-ide-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=code-ide-${{ matrix.name }}

  # ── Frontend ─────────────────────────────────────────────────────────────────
  build-and-push-web:
    name: Build and push web (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate image tag
        id: image_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi
          if [ "${IMAGE_TAG}" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid tag format: $IMAGE_TAG"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/frontend/Dockerfile
          build-args: |
            VITE_APP_VERSION=${{ steps.image_tag.outputs.value }}
            VITE_GIT_SHA=${{ github.sha }}
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish visibility note
        run: |
          echo "Images pushed to ghcr.io/${{ env.OWNER }}/insightbloom-*"
          echo "Tag: ${{ steps.image_tag.outputs.value }}"

  # ── Nota ─────────────────────────────────────────────────────────────────────
  # El deploy se gestiona via FluxCD desde el repo InsightBloom-gitops.
  # CI solo construye y publica imagenes en GHCR; Flux detecta nuevas
  # imagenes automaticamente y actualiza el HelmRelease en el cluster via
  # ImageUpdateAutomation.
