name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  services:
    name: Build & Test Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test all modules
        run: ./mvnw -f pom.xml clean verify

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend/web install

      - name: Build frontend
        run: npm --prefix frontend/web run build

      - name: Test frontend
        run: npm --prefix frontend/web run test

  chat:
    name: Test Chat Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat/requirements.txt

      - name: Install chat deps
        run: |
          pip install -r chat/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run chat unit tests
        run: cd chat && python -m pytest -v

  telegram:
    name: Test Telegram Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram/requirements.txt

      - name: Install telegram deps
        run: |
          pip install -r telegram/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run telegram unit tests
        run: cd telegram && python -m pytest -v
