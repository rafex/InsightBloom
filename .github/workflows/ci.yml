name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  services:
    name: Build & Test Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test all modules
        run: ./mvnw -f pom.xml clean verify

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 25
        uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend/web ci

      - name: Lint frontend
        run: npm --prefix frontend/web run lint

      - name: Typecheck frontend
        run: npm --prefix frontend/web run typecheck

      - name: Build frontend
        run: npm --prefix frontend/web run build

      - name: Test frontend
        run: npm --prefix frontend/web run test

  chat:
    name: Test Chat Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat/requirements.txt

      - name: Install chat deps
        run: |
          pip install -r chat/requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Run chat unit tests
        run: cd chat && python -m pytest -v

      - name: Audit chat dependencies
        # Keep the complete pip-audit report visible while Starlette's fixed
        # releases are still outside FastAPI's supported version range.
        continue-on-error: true
        run: pip-audit -r chat/requirements.txt

  telegram:
    name: Test Telegram Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram/requirements.txt

      - name: Install telegram deps
        run: |
          pip install -r telegram/requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Run telegram unit tests
        run: cd telegram && python -m pytest -v

      - name: Audit telegram dependencies
        # Keep the complete pip-audit report visible while Starlette's fixed
        # releases are still outside FastAPI's supported version range.
        continue-on-error: true
        run: pip-audit -r telegram/requirements.txt

  node-security:
    name: Audit Node service dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install presentation dependencies
        run: npm --prefix backend/services/insightbloom-presentations ci --omit=dev
      - name: Test Slidev FAT artifact auditor
        run: npm --prefix backend/services/insightbloom-presentations run test:audit:slidev
      - name: Audit presentation dependencies
        run: npm --prefix backend/services/insightbloom-presentations audit --omit=dev --audit-level=high
      - name: Audit frontend dependencies
        # Excalidraw's Mermaid dependency currently pins lodash-es/nanoid to
        # versions with upstream advisories. npm's only proposed remediation
        # is a breaking Excalidraw downgrade, so keep the report visible while
        # Dependabot tracks the first compatible release.
        continue-on-error: true
        run: npm --prefix frontend/web audit --omit=dev --audit-level=high
