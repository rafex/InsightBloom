---
name: Publish presentations image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
    paths:
      - 'backend/services/insightbloom-presentations/**'
      - '.github/workflows/publish-presentations.yml'
      - '.github/workflows/_build-standalone-service.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de version para la imagen (formato vN.YYYYmmDD[-N], ej: v1.20260424 o v1.20260424-1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-standalone-service.yml
    with:
      image_name: insightbloom-presentations
      context: backend/services/insightbloom-presentations
      dockerfile: backend/services/insightbloom-presentations/Dockerfile
      version_tag: ${{ github.event.inputs.version_tag || '' }}
      event_name: ${{ github.event_name }}
      ref_type: ${{ github.ref_type }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
