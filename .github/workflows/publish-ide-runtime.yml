name: Publish IDE runtime image

on:
  push:
    branches: [main]
    tags: ['v*.*']
    paths:
      - 'backend/services/insightbloom-ide-runtime/**'
      - '.github/workflows/publish-ide-runtime.yml'
      - '.github/workflows/_build-standalone-service.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versión'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-standalone-service.yml
    with:
      image_name: insightbloom-ide-runtime
      context: backend/services/insightbloom-ide-runtime
      dockerfile: backend/services/insightbloom-ide-runtime/Dockerfile
      version_tag: ${{ github.event.inputs.version_tag || '' }}
      event_name: ${{ github.event_name }}
      ref_type: ${{ github.ref_type }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
