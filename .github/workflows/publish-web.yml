---
name: Publish web (frontend) image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'
    paths:
      - 'frontend/web/**'
      - 'container/frontend/Dockerfile'
      - 'container/frontend/nginx.conf'
      - '.github/workflows/publish-web.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de version para la imagen (formato vN.YYYYmmDD[-N], ej: v1.20260424 o v1.20260424-1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: rafex

jobs:
  build-and-push-web:
    name: Build and push web (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate image tag
        id: image_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi
          if [ "${IMAGE_TAG}" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid tag format: $IMAGE_TAG"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/frontend/Dockerfile
          build-args: |
            VITE_APP_VERSION=${{ steps.image_tag.outputs.value }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_OFFLINE_MANIFEST_PUBLIC_KEY=${{ secrets.OFFLINE_MANIFEST_PUBLIC_KEY }}
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/insightbloom-web:build-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
