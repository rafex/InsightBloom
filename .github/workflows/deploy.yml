---
name: Deploy InsightBloom

on:
  workflow_call:
    inputs:
      version_tag:
        description: 'Tag de imagen a desplegar (opcional, formato vN.YYYYmmDD[-N])'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de imagen a desplegar (opcional, formato vN.YYYYmmDD[-N])'
        required: false
        default: ''
        type: string

env:
  K3S_NAMESPACE: mvps
  RELEASE_NAME: insightbloom
  CHART_PATH: ./infra/helm/charts/insightbloom
  SERVER_K3S: ${{ vars.SERVER_K3S }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "::error::Missing required secret: KUBE_CONFIG_DATA"
            echo "Create it in GitHub repo settings: Settings → Secrets and variables → Actions"
            echo "Content: base64-encoded kubeconfig from your k3s cluster"
            exit 1
          fi
          if [ -z "${{ vars.SERVER_K3S }}" ]; then
            echo "::error::Missing required variable: SERVER_K3S"
            echo "Create it in GitHub repo settings: Settings → Secrets and variables → Actions → Variables"
            echo "Value: IP or hostname of your k3s server (e.g. https://192.168.1.100:6443)"
            exit 1
          fi
          if [ -z "${{ secrets.PASSWORD_ADMIN_USER }}" ]; then
            echo "::error::Missing required secret: PASSWORD_ADMIN_USER"
            echo "Create it in GitHub repo settings: Settings → Secrets and variables → Actions"
            echo "Value: contraseña del usuario admin (ORGANIZER)"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          # Asegurar que SERVER_K3S tenga el prefijo https://
          SERVER="${{ vars.SERVER_K3S }}"
          if ! echo "$SERVER" | grep -q '^https\?://'; then
            SERVER="https://${SERVER}:6443"
          fi

          # Reemplazar el server del cluster en el kubeconfig
          CURRENT_SERVER=$(yq eval '.clusters[0].cluster.server' "$HOME/.kube/config")
          echo "Replacing server: $CURRENT_SERVER → $SERVER"
          yq eval -i \
            '.clusters[0].cluster.server = "'"$SERVER"'"' \
            "$HOME/.kube/config"

          # Deshabilitar verificación TLS y eliminar CA (incompatibles juntos)
          yq eval -i \
            '.clusters[0].cluster."insecure-skip-tls-verify" = true |
             del(.clusters[0].cluster."certificate-authority-data")' \
            "$HOME/.kube/config"

          # ── DUMP de diagnóstico del kubeconfig resultante ───────────────────
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            KUBECONFIG DIAGNOSTIC DUMP                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "── Contexts ──"
          kubectl config view --minify -o yaml 2>&1 || true
          echo ""
          echo "── Cluster info ──"
          kubectl cluster-info 2>&1 || true
          echo ""
          echo "── Auth check (whoami) ──"
          kubectl auth can-i get pods --all-namespaces 2>&1 || true
          echo ""
          echo "── Namespace list ──"
          kubectl get namespaces 2>&1 || true

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Resolve deploy image tag
        id: deploy_tag
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            IMAGE_TAG="${{ inputs.version_tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi

          if [ "$IMAGE_TAG" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid deploy tag format: $IMAGE_TAG"
            echo "Expected format: vN.YYYYmmDD[-N] (examples: v1.20260424, v1.20260424-1)"
            exit 1
          fi

          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploy image tag: $IMAGE_TAG"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "$K3S_NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$K3S_NAMESPACE"

      - name: Upsert admin auth secret in k3s
        env:
          PASSWORD_ADMIN_USER: ${{ secrets.PASSWORD_ADMIN_USER }}
        run: |
          kubectl -n "$K3S_NAMESPACE" create secret generic "${RELEASE_NAME}-admin-auth" \
            --from-literal=username=admin \
            --from-literal=password="$PASSWORD_ADMIN_USER" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert chat secrets in k3s
        env:
          LLM_PROVIDER_API_KEY: ${{ secrets.LLM_PROVIDER_API_KEY }}
          CHAT_SECRET_KEY: ${{ secrets.CHAT_SECRET_KEY }}
        run: |
          if [ -z "$LLM_PROVIDER_API_KEY" ]; then
            echo "::error::Missing required secret: LLM_PROVIDER_API_KEY"
            echo "Create it in GitHub repo settings: Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$CHAT_SECRET_KEY" ]; then
            echo "::warning::CHAT_SECRET_KEY not set — chat service will auto-generate one (not recommended for production)"
          fi
          kubectl -n "$K3S_NAMESPACE" create secret generic "${RELEASE_NAME}-chat-secrets" \
            --from-literal=llm-provider-api-key="$LLM_PROVIDER_API_KEY" \
            --from-literal=chat-secret-key="${CHAT_SECRET_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert users OTP-provider secrets in k3s
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
        run: |
          # Twilio/Zoho son opcionales: si no estan configurados, el OTP queda
          # deshabilitado en runtime con un error claro en vez de fallar el deploy.
          kubectl -n "$K3S_NAMESPACE" create secret generic "${RELEASE_NAME}-users-secrets" \
            --from-literal=twilio-auth-token="${TWILIO_AUTH_TOKEN:-}" \
            --from-literal=zoho-smtp-password="${ZOHO_SMTP_PASSWORD:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert internal service-to-service secret in k3s
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          # Si no esta configurado, los endpoints /internal/* quedan sin
          # proteger (modo desarrollo) en vez de fallar el deploy.
          kubectl -n "$K3S_NAMESPACE" create secret generic "${RELEASE_NAME}-internal-secrets" \
            --from-literal=internal-api-key="${INTERNAL_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"

      - name: Write Roberto prompt override (avoids --set, which breaks on multiline/commas)
        env:
          ROBERTO_SYSTEM_PROMPT: ${{ vars.ROBERTO_SYSTEM_PROMPT }}
        run: |
          if [ -z "$ROBERTO_SYSTEM_PROMPT" ]; then
            printf 'services: {}\n' > /tmp/roberto-prompt-values.yaml
          else
            {
              echo 'services:'
              echo '  chat:'
              echo '    env:'
              echo '      ROBERTO_SYSTEM_PROMPT: |'
              printf '%s\n' "$ROBERTO_SYSTEM_PROMPT" | sed 's/^/        /'
            } > /tmp/roberto-prompt-values.yaml
          fi

      - name: Deploy Helm release
        id: helm_deploy
        continue-on-error: true
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$K3S_NAMESPACE" \
            -f /tmp/roberto-prompt-values.yaml \
            --set image.tag="${{ steps.deploy_tag.outputs.value }}" \
            --set services.chat.env.LLM_PROVIDER_BASE_URL="${{ vars.LLM_PROVIDER_BASE_URL }}" \
            --set services.chat.env.LLM_PROVIDER_MODEL="${{ vars.LLM_PROVIDER_MODEL }}" \
            --set services.survey.env.LLM_PROVIDER_BASE_URL="${{ vars.LLM_PROVIDER_BASE_URL }}" \
            --set services.survey.env.LLM_PROVIDER_MODEL="${{ vars.LLM_PROVIDER_MODEL }}" \
            --set services.users.env.TWILIO_ACCOUNT_SID="${{ vars.TWILIO_ACCOUNT_SID }}" \
            --set services.users.env.TWILIO_FROM_NUMBER="${{ vars.TWILIO_FROM_NUMBER }}" \
            --set services.users.env.ZOHO_SMTP_HOST="${{ vars.ZOHO_SMTP_HOST || 'smtppro.zoho.com' }}" \
            --set services.users.env.ZOHO_SMTP_PORT="${{ vars.ZOHO_SMTP_PORT || '465' }}" \
            --set services.users.env.ZOHO_SMTP_USERNAME="${{ vars.ZOHO_SMTP_USERNAME }}" \
            --set services.users.env.ZOHO_FROM_ADDRESS="${{ vars.ZOHO_FROM_ADDRESS }}" \
            --atomic \
            --wait --timeout 10m

      - name: Force rollout restart (latest-tagged images need an explicit restart)
        id: rollout_restart
        if: steps.helm_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          for svc in users stats moderation query ingest chat web survey presentations; do
            kubectl -n "$K3S_NAMESPACE" rollout restart "deployment/${RELEASE_NAME}-${svc}"
          done

      - name: Show rollout status
        id: rollout_status
        if: steps.helm_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          for svc in users stats moderation query ingest chat web survey presentations; do
            kubectl -n "$K3S_NAMESPACE" rollout status "deployment/${RELEASE_NAME}-${svc}" --timeout=180s || true
          done

      - name: Dump diagnostics on failed deploy
        if: steps.helm_deploy.outcome == 'failure' || steps.rollout_status.outcome == 'failure'
        run: |
          echo "=== Deployments ==="
          kubectl -n "$K3S_NAMESPACE" get deploy
          echo
          echo "=== Pods ==="
          kubectl -n "$K3S_NAMESPACE" get pods -o wide
          echo
          echo "=== ReplicaSets ==="
          kubectl -n "$K3S_NAMESPACE" get rs
          echo
          echo "=== Events ==="
          kubectl -n "$K3S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 50 || true
          echo
          echo "=== All pods matching insightbloom ==="
          kubectl -n "$K3S_NAMESPACE" describe pods \
            -l app.kubernetes.io/instance="$RELEASE_NAME" || true

      - name: Fail if Helm deploy did not succeed
        if: steps.helm_deploy.outcome == 'failure' || steps.rollout_status.outcome == 'failure'
        run: |
          echo "Helm deploy no alcanzo estado Ready dentro del timeout" >&2
          exit 1

      - name: Build admin CLI
        if: steps.helm_deploy.outcome == 'success' && steps.rollout_status.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Compile admin CLI
        if: steps.helm_deploy.outcome == 'success' && steps.rollout_status.outcome == 'success'
        run: mvn -f backend/cli/insightbloom-cli/pom.xml clean package -DskipTests -q

      - name: Ensure admin user exists/updated from secret
        if: steps.helm_deploy.outcome == 'success' && steps.rollout_status.outcome == 'success'
        env:
          PASSWORD_ADMIN_USER: ${{ secrets.PASSWORD_ADMIN_USER }}
        run: |
          ./scripts/run/k3s-create-user.sh \
            --namespace "$K3S_NAMESPACE" \
            --release "$RELEASE_NAME" \
            --username admin \
            --password "$PASSWORD_ADMIN_USER" \
            --role ORGANIZER

      - name: Print deployed image reference
        if: steps.helm_deploy.outcome == 'success' && steps.rollout_status.outcome == 'success'
        run: |
          echo "Deployed successfully with tag: ${{ steps.deploy_tag.outputs.value }}"
          echo "All images: ghcr.io/rafex/insightbloom-{users,stats,moderation,query,ingest,chat,web}:${{ steps.deploy_tag.outputs.value }}"
