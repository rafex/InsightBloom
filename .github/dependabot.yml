    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /backend/services/insightbloom-presentations
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /chat
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
