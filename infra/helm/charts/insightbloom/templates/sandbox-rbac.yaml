{{- if .Values.sandbox.enabled }}
# Fase 3 del IDE: insightbloom-users crea/borra Pods+Services de sandbox directo contra el API
# de Kubernetes (ver KubernetesPodClient) — sin esta Role+RoleBinding el API server responde 403.
# Se reusa el ServiceAccount que ya usa el Deployment de insightbloom-users (namespace principal
# de la release), scoped via RoleBinding al namespace aislado de sandboxes — no se crea un
# ServiceAccount nuevo.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insightbloom-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insightbloom-sandbox-manager-binding
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insightbloom-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "insightbloom.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
