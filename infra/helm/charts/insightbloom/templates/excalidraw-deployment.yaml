{{- if .Values.excalidraw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insightbloom.fullname" . }}-excalidraw
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: excalidraw
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.excalidraw.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "insightbloom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: excalidraw
  template:
    metadata:
      labels:
        {{- include "insightbloom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: excalidraw
    spec:
      serviceAccountName: {{ include "insightbloom.serviceAccountName" . }}
      containers:
        - name: excalidraw
          # La imagen oficial (nginx:alpine con el build estatico de Excalidraw) espera correr
          # como root: su master de nginx necesita bindear el puerto 80 (privilegiado) y
          # bajar privilegios a un usuario "nginx" (uid 101) para los workers via su propio
          # directive "user nginx;" — forzar el securityContext no-root/uid-1000 compartido de
          # la plataforma (ver .Values.securityContext) rompe el mkdir de sus directorios de
          # cache temporal (EACCES), verificado en vivo contra la imagen real. Se deja sin
          # override de securityContext, a diferencia del resto de servicios de este chart.
          image: "{{ .Values.excalidraw.repository }}:{{ .Values.excalidraw.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.excalidraw.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.excalidraw.resources | nindent 12 }}
{{- end }}
