{{- if .Values.excalidraw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insightbloom.fullname" . }}-excalidraw
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: excalidraw
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.excalidraw.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "insightbloom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: excalidraw
  template:
    metadata:
      labels:
        {{- include "insightbloom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: excalidraw
    spec:
      serviceAccountName: {{ include "insightbloom.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: excalidraw
          # La imagen oficial (nginx:alpine con el build estatico de Excalidraw) trae su propio
          # usuario "nginx" (uid 101, no el uid-1000 compartido del resto de la plataforma).
          # Corre non-root sin necesitar bindear el puerto 80 (privilegiado) gracias a:
          # (a) el ConfigMap excalidraw-configmap.yaml, que reescribe default.conf para
          #     escuchar en 8080 en vez de 80;
          # (b) emptyDirs en /var/cache/nginx y /run — en la imagen esos paths son root:root
          #     0755 (el chown a nginx solo ocurre en el arranque como root de la imagen
          #     oficial, que aqui nunca corremos), asi que uid 101 no puede escribir ahi sin
          #     un volumen propio. Verificado en vivo contra la imagen real.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.excalidraw.repository }}:{{ .Values.excalidraw.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.excalidraw.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "insightbloom.fullname" . }}-excalidraw-nginx-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
{{- end }}
