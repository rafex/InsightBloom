{{- if .Values.excalidraw.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insightbloom.fullname" . }}-excalidraw-nginx-conf
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: excalidraw
data:
  # Mismo default.conf de la imagen oficial (nginx:alpine), solo con el listen cambiado de 80
  # (privilegiado) a 8080, para poder correr como el usuario "nginx" (uid 101) propio de la
  # imagen sin necesitar root — ver comentario en excalidraw-deployment.yaml.
  default.conf: |
    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
{{- end }}
