{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insightbloom.fullname" $ }}-{{ $name }}
  labels:
    {{- include "insightbloom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- $autoscalingEnabled := dig "autoscaling" "enabled" $.Values.autoscaling.enabled $svc }}
  {{- if not $autoscalingEnabled }}
  replicas: {{ dig "replicaCount" $.Values.replicaCount $svc }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "insightbloom.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "insightbloom.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "insightbloom.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
            {{- if $svc.runAsUser }}
            runAsUser: {{ $svc.runAsUser }}
            runAsGroup: {{ $svc.runAsGroup }}
            {{- end }}
          image: "{{ $svc.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $svc.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- if eq $name "users" }}
            # Fase 3/4 del IDE: insightbloom-users crea los Pods/Services de sandbox directo
            # contra el API de Kubernetes (ver KubernetesPodClient) — mismos valores que
            # .Values.sandbox usa para el ResourceQuota/LimitRange del namespace, para que
            # el spec de Pod que arma el backend nunca exceda esos limites. Fase 4: cada Pod
            # tiene 2 contenedores (ide + runtime), cada uno con su propia imagen y recursos.
            - name: SANDBOX_NAMESPACE
              value: {{ $.Values.sandbox.namespace | quote }}
            - name: SANDBOX_SERVER_IMAGE
              value: {{ $.Values.sandbox.images.server | quote }}
            - name: SANDBOX_RUNTIME_IMAGE_BASE
              value: {{ $.Values.sandbox.images.runtimeBase | quote }}
            - name: SANDBOX_IDE_CPU_REQUEST
              value: {{ $.Values.sandbox.resources.ide.requests.cpu | quote }}
            - name: SANDBOX_IDE_MEMORY_REQUEST
              value: {{ $.Values.sandbox.resources.ide.requests.memory | quote }}
            - name: SANDBOX_IDE_CPU_LIMIT
              value: {{ $.Values.sandbox.resources.ide.limits.cpu | quote }}
            - name: SANDBOX_IDE_MEMORY_LIMIT
              value: {{ $.Values.sandbox.resources.ide.limits.memory | quote }}
            - name: SANDBOX_RUNTIME_CPU_REQUEST
              value: {{ $.Values.sandbox.resources.runtime.requests.cpu | quote }}
            - name: SANDBOX_RUNTIME_MEMORY_REQUEST
              value: {{ $.Values.sandbox.resources.runtime.requests.memory | quote }}
            - name: SANDBOX_RUNTIME_CPU_LIMIT
              value: {{ $.Values.sandbox.resources.runtime.limits.cpu | quote }}
            - name: SANDBOX_RUNTIME_MEMORY_LIMIT
              value: {{ $.Values.sandbox.resources.runtime.limits.memory | quote }}
            - name: SANDBOX_PORT
              value: {{ $.Values.sandbox.port | quote }}
            - name: SANDBOX_UID
              value: {{ $.Values.sandbox.securityContext.runAsUser | quote }}
            - name: SANDBOX_GID
              value: {{ $.Values.sandbox.securityContext.runAsGroup | quote }}
            - name: SANDBOX_FSGROUP
              value: {{ $.Values.sandbox.securityContext.fsGroup | quote }}
            - name: SANDBOX_TTL_SECONDS_AFTER_EVENT_EXPIRY
              value: {{ $.Values.sandbox.ttlSecondsAfterEventExpiry | quote }}
            {{- end }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            {{- toYaml $svc.livenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            {{- toYaml $.Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml $svc.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            {{- toYaml $.Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $svc.startupProbe }}
          startupProbe:
            {{- toYaml $svc.startupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            {{- toYaml $.Values.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- if eq $name "web" }}
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          {{- end }}
      volumes:
        - name: data
          {{- if and $svc.persistence $svc.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "insightbloom.fullname" $ }}-{{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq $name "web" }}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
