{{- if .Values.etherpad.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insightbloom.fullname" . }}-etherpad
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: etherpad
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.etherpad.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "insightbloom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: etherpad
{{- end }}
