{{- if .Values.sandbox.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: insightbloom-sandboxes-quota
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "insightbloom.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  hard:
    # Límite de pods totales en el namespace (pool size máximo de plataforma)
    pods: "{{ .Values.sandbox.poolMaxTotalPerPlatform }}"
    # CPU total: pool_max * cpu_limit_por_pod (ide+runtime combinados, ver resources.podLimits)
    # 200 pods * 750m = 150 cores (ajustar según capacidad del cluster)
    requests.cpu: "{{ mul .Values.sandbox.poolMaxTotalPerPlatform 750 }}m"
    limits.cpu: "{{ mul .Values.sandbox.poolMaxTotalPerPlatform 750 }}m"
    # Memoria total: pool_max * memory_limit_por_pod (ide+runtime combinados)
    # 200 pods * 1.5Gi = 300Gi (ajustar según capacidad del cluster)
    requests.memory: "{{ mul .Values.sandbox.poolMaxTotalPerPlatform 1.5 }}Gi"
    limits.memory: "{{ mul .Values.sandbox.poolMaxTotalPerPlatform 1.5 }}Gi"
    # Limite de PVCs (no usado actualmente, pero pre-configurado)
    persistentvolumeclaims: "0"
  scopeSelector:
    matchExpressions: []
---
apiVersion: v1
kind: LimitRange
metadata:
  name: insightbloom-sandboxes-limits
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "insightbloom.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  limits:
  - type: Pod
    min:
      cpu: 50m
      memory: 256Mi
    # Suma de los dos contenedores del Pod (ide + runtime) — ver .Values.sandbox.resources.podLimits
    max:
      cpu: "{{ .Values.sandbox.resources.podLimits.cpu }}"
      memory: "{{ .Values.sandbox.resources.podLimits.memory }}"
  - type: Container
    min:
      cpu: 50m
      memory: 256Mi
    # Techo por contenedor: se usa el limite de "runtime" (el mas generoso de los dos) como tope,
    # ya que el LimitRange de tipo Container aplica por igual a ambos contenedores del Pod.
    max:
      cpu: "{{ .Values.sandbox.resources.runtime.limits.cpu }}"
      memory: "{{ .Values.sandbox.resources.runtime.limits.memory }}"
    default:
      cpu: "{{ .Values.sandbox.resources.runtime.limits.cpu }}"
      memory: "{{ .Values.sandbox.resources.runtime.limits.memory }}"
    defaultRequest:
      cpu: "{{ .Values.sandbox.resources.runtime.requests.cpu }}"
      memory: "{{ .Values.sandbox.resources.runtime.requests.memory }}"
{{- end }}
