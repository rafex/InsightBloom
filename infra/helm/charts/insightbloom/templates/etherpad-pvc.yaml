{{- if and .Values.etherpad.enabled .Values.etherpad.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "insightbloom.fullname" . }}-etherpad-data
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: etherpad
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.etherpad.persistence.storageClass | default "local-path" }}
  resources:
    requests:
      storage: {{ .Values.etherpad.persistence.size | default "1Gi" }}
{{- end }}
