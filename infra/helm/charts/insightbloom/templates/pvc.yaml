{{- range $name, $svc := .Values.services }}
{{- if and $svc.persistence $svc.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "insightbloom.fullname" $ }}-{{ $name }}-data
  labels:
    {{- include "insightbloom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $svc.persistence.storageClass | default "local-path" }}
  resources:
    requests:
      storage: {{ $svc.persistence.size | default "1Gi" }}
---
{{- end }}
{{- end }}
