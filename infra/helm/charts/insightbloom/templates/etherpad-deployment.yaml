{{- if .Values.etherpad.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insightbloom.fullname" . }}-etherpad
  labels:
    {{- include "insightbloom.labels" . | nindent 4 }}
    app.kubernetes.io/component: etherpad
spec:
  # Instancia unica y fija: Etherpad mantiene el estado de edicion en vivo de cada pad
  # en memoria del propio proceso, asi que multiples replicas sin un backend de sesion
  # compartido (ej. ep_redis) romperian la colaboracion en tiempo real entre asistentes
  # conectados a pods distintos. SQLite (single-writer) tampoco se beneficia de mas
  # replicas. Ver DEC-0020.
  replicas: 1
  selector:
    matchLabels:
      {{- include "insightbloom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: etherpad
  template:
    metadata:
      labels:
        {{- include "insightbloom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: etherpad
    spec:
      serviceAccountName: {{ include "insightbloom.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        # fsGroup asegura que los volumenes (incluido el emptyDir de "var" de abajo) queden
        # escribibles por el uid no-root del contenedor. Sin esto, Etherpad falla al arrancar
        # con EACCES al intentar escribir var/installed_plugins.json (ese directorio, parte
        # de la imagen, no es escribible por el uid 1000 forzado por .Values.securityContext).
        fsGroup: {{ .Values.securityContext.runAsUser | default 1000 }}
      containers:
        - name: etherpad
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.etherpad.repository }}:{{ .Values.etherpad.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_TYPE
              value: sqlite
            - name: DB_FILENAME
              value: /data/etherpad.db
            - name: TITLE
              value: "InsightBloom Notas"
            - name: TRUST_PROXY
              value: "true"
            - name: DISABLE_IP_LOGGING
              value: "true"
          ports:
            - name: http
              containerPort: {{ .Values.etherpad.port }}
              protocol: TCP
          # startupProbe con presupuesto amplio (hasta 10 min): con DB_TYPE=sqlite, Etherpad
          # compila el driver nativo de SQLite (node-gyp) en el primer arranque, lo que puede
          # tardar mucho mas que el resto de servicios de la plataforma. Mientras el
          # startupProbe no pase, liveness/readiness NO se evaluan — sin esto, el liveness
          # probe mataba el contenedor a los 15s, antes de que terminara de arrancar.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.etherpad.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # El API key fijo (secret) sobreescribe el que Etherpad autogeneraria en el
            # primer arranque, para que el backend de insightbloom-users pueda llamar a
            # su API HTTP con un valor conocido de antemano (ver TASK-0042/NFR-007).
            - name: apikey
              mountPath: /opt/etherpad-lite/APIKEY.txt
              subPath: APIKEY.txt
              readOnly: true
            # var/ guarda bookkeeping de plugins (installed_plugins.json, etc.) que Etherpad
            # necesita poder escribir al arrancar; no es parte de /data (efimero esta bien,
            # se regenera solo).
            - name: var
              mountPath: /opt/etherpad-lite/var
      volumes:
        - name: data
          {{- if .Values.etherpad.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "insightbloom.fullname" . }}-etherpad-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: apikey
          secret:
            secretName: {{ include "insightbloom.fullname" . }}-etherpad-secrets
            items:
              - key: api-key
                path: APIKEY.txt
        - name: var
          emptyDir: {}
{{- end }}
