replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressChat:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: chat-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Services ───────────────────────────────────────────────────────────────────
services:
  users:
    repository: ghcr.io/rafex/insightbloom-users
    port: 8081
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8081"
      DB_PATH: /data/users.db
      INGEST_URL: http://insightbloom-ingest:8082
      QUERY_URL: http://insightbloom-query:8083
      MODERATION_URL: http://insightbloom-moderation:8084
      PRESENTATIONS_URL: http://insightbloom-presentations:8091
      SURVEY_URL: http://insightbloom-survey:8086

  stats:
    repository: ghcr.io/rafex/insightbloom-stats
    port: 8085
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8085"
      DB_PATH: /data/stats.db

  moderation:
    repository: ghcr.io/rafex/insightbloom-moderation
    port: 8084
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8084"
      DB_PATH: /data/moderation.db
      QUERY_SERVICE_URL: http://insightbloom-query:8083

  query:
    repository: ghcr.io/rafex/insightbloom-query
    port: 8083
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8083"
      DB_PATH: /data/query.db

  ingest:
    repository: ghcr.io/rafex/insightbloom-ingest
    port: 8082
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8082"
      DB_PATH: /data/ingest.db
      USERS_URL: http://insightbloom-users:8081
      MODERATION_URL: http://insightbloom-moderation:8084
      STATS_URL: http://insightbloom-stats:8085
      QUERY_URL: http://insightbloom-query:8083

  survey:
    repository: ghcr.io/rafex/insightbloom-survey
    port: 8086
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8086"
      DB_PATH: /data/survey.db
      PRESENTATIONS_BASE_URL: http://insightbloom-presentations:8091
      LLM_PROVIDER_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_PROVIDER_MODEL: "openai/gpt-oss-120b"
    secretEnv:
      - name: LLM_PROVIDER_API_KEY
        secretName: insightbloom-chat-secrets
        secretKey: llm-provider-api-key

  presentations:
    repository: ghcr.io/rafex/insightbloom-presentations
    port: 8091
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
    env:
      PORT: "8091"
      DATA_DIR: /data

  web:
    repository: ghcr.io/rafex/insightbloom-web
    port: 8080
    runAsUser: 101
    runAsGroup: 101
    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  chat:
    repository: ghcr.io/rafex/insightbloom-chat
    port: 8090
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8090"
      DB_PATH: /data/chat.db
      INGEST_URL: http://insightbloom-ingest:8082
      USERS_URL:  http://insightbloom-users:8081
      LLM_PROVIDER_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_PROVIDER_MODEL: "openai/gpt-oss-120b"
    secretEnv:
      - name: LLM_PROVIDER_API_KEY
        secretName: insightbloom-chat-secrets
        secretKey: llm-provider-api-key
      - name: CHAT_SECRET_KEY
        secretName: insightbloom-chat-secrets
        secretKey: chat-secret-key

nodeSelector: {}
tolerations: []
affinity: {}
