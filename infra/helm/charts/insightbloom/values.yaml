replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10

networkPolicy:
  enabled: true

backup:
  enabled: true
  schedule: "0 2 * * *"   # daily at 02:00 UTC
  retain: 7                # keep last N backups per service

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

nats:
  repository: nats
  tag: "2-alpine"
  port: 4222
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi

# drawio es una instancia compartida (multi-tenant) para toda la plataforma, no un
# pod por evento: el editor es completamente stateless (no persiste diagramas del
# lado del servidor), así que no hay nada que aislar por evento — ver DEC-0020.
drawio:
  enabled: true
  repository: jgraph/drawio
  tag: "24.7.17"
  port: 8080
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: 30m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Etherpad tambien es una instancia compartida (multi-tenant), pero a diferencia de
# drawio SI persiste datos del lado del servidor: un pad por evento (padID = event.uuid),
# en SQLite sobre un PVC dedicado. Replica unica y fija (ver nota en el Deployment) —
# los pads son efimeros por diseño (TTL = fin del evento + 1h, job de limpieza en
# insightbloom-users, ver DEC-0020), asi que no necesita la robustez de un motor
# externo como Postgres.
etherpad:
  enabled: true
  repository: etherpad/etherpad
  tag: "2.3.1"
  port: 9001
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 30m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Excalidraw self-hosted (TASK-0031): igual que drawio, stateless total del lado del
# servidor — la app oficial guarda el dibujo en localStorage/exportacion del navegador.
# Colaboracion en vivo (excalidraw-room) queda deferida (ver DEC-0020): la imagen oficial
# necesita la URL del websocket "baked in" en build-time, no configurable via env var en
# runtime; se resuelve en una tarea aparte si se decide construir una imagen propia.
excalidraw:
  enabled: true
  repository: excalidraw/excalidraw
  tag: "latest"
  port: 80
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

ingress:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressChat:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: chat-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressTelegram:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: telegram-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressDrawio:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: drawio-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressExcalidraw:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: excalidraw-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Se intento un allowlist explicito de paths (excluyendo /api y /admin) pero Kubernetes
# Prefix pathType hace match por segmento completo de "/", no por prefijo de caracteres:
# el bootstrap JS del cliente de Etherpad se sirve en la raiz con nombre dinamico
# (ej. /padbootstrap-<hash>.min.js), que NO matchea ningun prefijo de segmento razonable,
# asi que el allowlist rompia la carga del pad (404 en ese script). Se revierte a "/"
# catch-all, igual que drawio: /api/1/* sigue protegido por el apikey (64 hex, no
# adivinable) y /admin requiere su propio login de Etherpad — misma superficie de riesgo
# ya aceptada para drawio, que tampoco tiene autenticacion propia en su endpoint publico.
ingressEtherpad:
  enabled: true
  className: haproxy
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: etherpad-insightbloom.v1.rafex.cloud
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Services ───────────────────────────────────────────────────────────────────
services:
  # Proxy autenticador delante de drawio/Excalidraw/Etherpad: exige sesion de InsightBloom
  # antes de reenviar cualquier request al pod real de la herramienta — asi pegar la URL
  # publica directamente (bypaseando el frontend) ya no da acceso a nadie sin sesion.
  # GATEWAY_ROUTES se completa en deploy.yml/values del ingress (mismos hosts que
  # ingressDrawio/ingressExcalidraw/ingressEtherpad ya usan).
  toolsgateway:
    repository: ghcr.io/rafex/insightbloom-tools-gateway
    port: 8090
    autoscaling:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 60
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi
    env:
      PORT: "8090"
      AUTH_VALIDATE_URL: http://insightbloom-users:8081/api/v1/auth/validate
      GATEWAY_LOGIN_URL: https://insightbloom.v1.rafex.cloud/login
      GATEWAY_ROUTES: >-
        drawio-insightbloom.v1.rafex.cloud=http://insightbloom-drawio:8080,
        excalidraw-insightbloom.v1.rafex.cloud=http://insightbloom-excalidraw:80,
        etherpad-insightbloom.v1.rafex.cloud=http://insightbloom-etherpad:9001

  users:
    repository: ghcr.io/rafex/insightbloom-users
    port: 8081
    autoscaling:
      targetCPUUtilizationPercentage: 50
    resources:
      requests:
        cpu: 40m
        memory: 192Mi
      limits:
        cpu: 350m
        memory: 768Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8081"
      DB_PATH: /data/users.db
      INGEST_URL: http://insightbloom-ingest:8082
      QUERY_URL: http://insightbloom-query:8083
      MODERATION_URL: http://insightbloom-moderation:8084
      PRESENTATIONS_URL: http://insightbloom-presentations:8091
      SURVEY_URL: http://insightbloom-survey:8086
      TELEGRAM_URL: http://insightbloom-telegram:8095
      DRAWIO_BASE_URL: https://drawio-insightbloom.v1.rafex.cloud
      EXCALIDRAW_BASE_URL: https://excalidraw-insightbloom.v1.rafex.cloud
      ETHERPAD_BASE_URL: https://etherpad-insightbloom.v1.rafex.cloud
      TWILIO_ACCOUNT_SID: ""
      TWILIO_FROM_NUMBER: ""
      ZOHO_SMTP_HOST: "smtppro.zoho.com"
      ZOHO_SMTP_PORT: "465"
      ZOHO_SMTP_USERNAME: ""
      ZOHO_FROM_ADDRESS: ""
    secretEnv:
      - name: TWILIO_AUTH_TOKEN
        secretName: insightbloom-users-secrets
        secretKey: twilio-auth-token
      - name: ZOHO_SMTP_PASSWORD
        secretName: insightbloom-users-secrets
        secretKey: zoho-smtp-password
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key
      - name: ETHERPAD_API_KEY
        secretName: insightbloom-etherpad-secrets
        secretKey: api-key
      - name: JAAS_APP_ID
        secretName: insightbloom-jaas-secrets
        secretKey: app-id
      - name: JAAS_API_KEY_ID
        secretName: insightbloom-jaas-secrets
        secretKey: api-key-id
      - name: JAAS_PRIVATE_KEY
        secretName: insightbloom-jaas-secrets
        secretKey: private-key

  stats:
    repository: ghcr.io/rafex/insightbloom-stats
    port: 8085
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8085"
      DB_PATH: /data/stats.db
      USERS_URL: http://insightbloom-users:8081
    secretEnv:
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

  moderation:
    repository: ghcr.io/rafex/insightbloom-moderation
    port: 8084
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8084"
      DB_PATH: /data/moderation.db
      QUERY_SERVICE_URL: http://insightbloom-query:8083
      USERS_URL: http://insightbloom-users:8081
    secretEnv:
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

  query:
    repository: ghcr.io/rafex/insightbloom-query
    port: 8083
    resources:
      requests:
        cpu: 25m
        memory: 160Mi
      limits:
        cpu: 200m
        memory: 512Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8083"
      DB_PATH: /data/query.db
      NATS_URL: nats://insightbloom-nats:4222
    secretEnv:
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key
      - name: NATS_AUTH_TOKEN
        secretName: insightbloom-nats-secrets
        secretKey: nats-auth-token

  ingest:
    repository: ghcr.io/rafex/insightbloom-ingest
    port: 8082
    autoscaling:
      targetCPUUtilizationPercentage: 50
    resources:
      requests:
        cpu: 40m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8082"
      DB_PATH: /data/ingest.db
      USERS_URL: http://insightbloom-users:8081
      MODERATION_URL: http://insightbloom-moderation:8084
      STATS_URL: http://insightbloom-stats:8085
      QUERY_URL: http://insightbloom-query:8083
    secretEnv:
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

  survey:
    repository: ghcr.io/rafex/insightbloom-survey
    port: 8086
    resources:
      requests:
        cpu: 30m
        memory: 160Mi
      limits:
        cpu: 250m
        memory: 512Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8086"
      DB_PATH: /data/survey.db
      PRESENTATIONS_BASE_URL: http://insightbloom-presentations:8091
      LLM_PROVIDER_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_PROVIDER_MODEL: "openai/gpt-oss-120b"
    secretEnv:
      - name: LLM_PROVIDER_API_KEY
        secretName: insightbloom-chat-secrets
        secretKey: llm-provider-api-key
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

  presentations:
    repository: ghcr.io/rafex/insightbloom-presentations
    port: 8091
    resources:
      requests:
        cpu: 30m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 640Mi
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
    env:
      PORT: "8091"
      DATA_DIR: /data
      USERS_URL: http://insightbloom-users:8081
      FRONTEND_BASE_URL: https://insightbloom.v1.rafex.cloud
      NATS_URL: nats://insightbloom-nats:4222
    secretEnv:
      - name: NATS_AUTH_TOKEN
        secretName: insightbloom-nats-secrets
        secretKey: nats-auth-token
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

  web:
    repository: ghcr.io/rafex/insightbloom-web
    port: 8080
    runAsUser: 101
    runAsGroup: 101
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  chat:
    repository: ghcr.io/rafex/insightbloom-chat
    port: 8090
    resources:
      requests:
        cpu: 30m
        memory: 192Mi
      limits:
        cpu: 250m
        memory: 640Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8090"
      DB_PATH: /data/chat.db
      INGEST_URL: http://insightbloom-ingest:8082
      USERS_URL:  http://insightbloom-users:8081
      PRESENTATIONS_URL: http://insightbloom-presentations:8091
      LLM_PROVIDER_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_PROVIDER_MODEL: "openai/gpt-oss-120b"
      ROBERTO_GUARDRAIL_MODEL: "openai/gpt-oss-safeguard-20b"
      NATS_URL: nats://insightbloom-nats:4222
    secretEnv:
      - name: LLM_PROVIDER_API_KEY
        secretName: insightbloom-chat-secrets
        secretKey: llm-provider-api-key
      - name: CHAT_SECRET_KEY
        secretName: insightbloom-chat-secrets
        secretKey: chat-secret-key
      - name: NATS_AUTH_TOKEN
        secretName: insightbloom-nats-secrets
        secretKey: nats-auth-token

  telegram:
    repository: ghcr.io/rafex/insightbloom-telegram
    port: 8095
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        cpu: 100m
        memory: 256Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    env:
      PORT: "8095"
      DB_PATH: /data/telegram.db
      INGEST_URL: http://insightbloom-ingest:8082
      USERS_URL: http://insightbloom-users:8081
    secretEnv:
      - name: TELEGRAM_BOT_TOKEN
        secretName: insightbloom-telegram-secrets
        secretKey: bot-token
      - name: TELEGRAM_WEBHOOK_SECRET
        secretName: insightbloom-telegram-secrets
        secretKey: webhook-secret
      - name: INTERNAL_API_KEY
        secretName: insightbloom-internal-secrets
        secretKey: internal-api-key

nodeSelector: {}
tolerations: []
affinity: {}
