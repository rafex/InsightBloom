# ==============================================================================
# .tmux.conf - InsightBloom IDE
# ==============================================================================

# ------------------------------------------------------------------------------
# Prefix
# ------------------------------------------------------------------------------
set -g prefix C-b
bind C-b send-prefix

# ------------------------------------------------------------------------------
# Opciones generales
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
# El terminal se sirve dentro de ttyd: el navegador debe conservar el arrastre
# para seleccionar texto y copiarlo manualmente. Con mouse on tmux captura el
# gesto, entra/sale del modo visual y la selección desaparece inmediatamente.
set -g mouse off

# Índices desde 0
set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0
set -g renumber-windows on

# Reducir delay de ESC (importante en Neovim)
set -sg escape-time 0

# ------------------------------------------------------------------------------
# Splits y ventanas en el directorio actual
# ------------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# Navegación entre paneles - compatible con vim-tmux-navigator
# ------------------------------------------------------------------------------
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize de paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------------------------
# Copiar en modo vi
# ------------------------------------------------------------------------------
set-window-option -g mode-keys vi
# Desactiva la integración de tmux con el portapapeles del terminal web (OSC 52).
# La selección queda disponible para copiarla manualmente desde el navegador.
set -s set-clipboard off
bind -T copy-mode-vi v send -X begin-selection
# Conserva la selección visible en la terminal web. No se envía al portapapeles del navegador:
# el usuario puede copiarla manualmente con el mecanismo de su navegador/terminal.
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind P paste-buffer

# Recarga rápida de config
bind r source-file /etc/tmux.conf \; display "✓ tmux.conf recargado"

# ------------------------------------------------------------------------------
# Status bar
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "
set -g status-right "#[fg=#a6e3a1] %d-%b #[fg=#45475a]│#[fg=#89dceb] %H:%M #[fg=#45475a]│#[fg=#f38ba8] #H "
set-window-option -g window-status-current-style "fg=#fab387,bold"
set-window-option -g window-status-current-format " #I:#W "
set-window-option -g window-status-style "fg=#6c7086"
set-window-option -g window-status-format " #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Plugins are vendored in the image so runtime does not need network access.
# A global path also makes tmux work for multi-seat student accounts.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "/usr/local/share/insightbloom/tmux/plugins/"
run-shell "/usr/local/share/insightbloom/tmux/plugins/tpm/tpm"
