# Necesario para soportar el upgrade a WebSocket en /api/presentations
# (sincronización en vivo de slides) sin romper las rutas HTTP normales:
# si el request no trae header Upgrade, $connection_upgrade resuelve a "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Vista previa para redes sociales ─────────────────────────────────────────
# WhatsApp/Telegram/Facebook/etc. no ejecutan JS: si les servimos la SPA nunca ven
# los meta og:*. Detectamos su user-agent y los redirigimos al HTML estático con
# metadatos que genera el servicio de presentaciones; los navegadores normales
# siguen yendo a la SPA sin ningún cambio.
map $http_user_agent $is_social_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|WhatsApp|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot|Googlebot|bingbot|Pinterest|redditbot|SkypeUriPreview|vkShare)" 1;
}

# ── Rate limiting ────────────────────────────────────────────────────────────
# auth_limit: 5 req/min por IP para login, registro y OTP (burst=3 sin delay)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# otp_limit: 2 req/min por IP para envío de OTP (más agresivo: 6 dígitos)
limit_req_zone $binary_remote_addr zone=otp_limit:10m  rate=2r/m;

server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Jitsi se monta en un iframe de meet.jit.si o 8x8.vc. La política anterior
    # camera=()/microphone=() bloqueaba Chrome aunque el usuario ya hubiera
    # concedido ambos permisos al sitio principal.
    add_header Permissions-Policy 'camera=(self "https://8x8.vc" "https://*.8x8.vc" "https://meet.jit.si" "https://*.meet.jit.si"), microphone=(self "https://8x8.vc" "https://*.8x8.vc" "https://meet.jit.si" "https://*.meet.jit.si"), geolocation=(), payment=()' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # www.youtube.com se suma a script-src (carga dinamica de
    # https://www.youtube.com/iframe_api, ver OnDemandVideoPage.vue) y a
    # frame-src (el iframe del embed en si) para el tier gratuito de cursos
    # on-demand. PeerTube NO se puede sumar aca: es federado a proposito, cada
    # organizador pega la URL de un nodo publico distinto elegido en runtime --
    # un CSP estatico no puede allowlistear un dominio que no se conoce hasta
    # que existe la conferencia. Queda como limitacion conocida del tier
    # gratuito hasta que se resuelva con un mecanismo de CSP dinamico (fuera de
    # alcance de este fix puntual de YouTube).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://insightbloom.v1.rafex.cloud; script-src 'self' 'unsafe-eval' https://8x8.vc https://*.8x8.vc https://meet.jit.si https://*.meet.jit.si https://www.youtube.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' blob: https://8x8.vc https://*.8x8.vc https://meet.jit.si https://*.meet.jit.si https://drawio-insightbloom.v1.rafex.cloud https://excalidraw-insightbloom.v1.rafex.cloud https://etherpad-insightbloom.v1.rafex.cloud https://chat-insightbloom.v1.rafex.cloud https://ide-insightbloom.v1.rafex.cloud https://preview-insightbloom.v1.rafex.cloud https://www.youtube.com; media-src 'self' data: blob: https:" always;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compresión ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json
        application/javascript text/javascript
        image/svg+xml application/xml;

    # ── Headers proxy comunes ────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";
    proxy_read_timeout  60s;
    proxy_connect_timeout 5s;

    # ── API routing ── replica exacta de los proxies de vite.config.js ──────
    #    vite: path.replace(/^\/api\/users/, '')   → nginx: rewrite sin /

    # Rate-limited auth endpoints (must come before the broader /api/users block)
    location = /api/users/api/v1/auth/otp/send {
        limit_req zone=otp_limit burst=2 nodelay;
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
    }

    location ~ ^/api/users/api/v1/auth/(login|register|otp/verify)$ {
        limit_req zone=auth_limit burst=3 nodelay;
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
    }

    # Ticket claim without an existing account can create a guest identity.
    # Keep it under the same per-IP authentication budget.
    location ~ ^/api/users/api/v1/conferences/[^/]+/tickets/claim$ {
        limit_req zone=auth_limit burst=3 nodelay;
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
    }

    # El flyer se valida y normaliza en insightbloom-users. El límite se aplica
    # solo a esta ruta para no ampliar el tamaño permitido de todos los
    # endpoints de Users. El backend acepta hasta 8 MiB de imagen más el
    # overhead controlado del multipart.
    location ~ ^/api/users/api/v1/conferences/[^/]+/flyer$ {
        client_max_body_size 9m;
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
    }

    # El editor de certificados guarda el documento completo (bloques + fondo + logo, todo en
    # base64) como un único JSON -- el backend acepta hasta 6 MB de documentJson (ver
    # CertificateTemplateHandler.MAX_DOCUMENT_LENGTH), pero sin esta location quedaba sujeto al
    # límite genérico de /api/users (~1 MiB por defecto), rechazando en el proxy antes de llegar
    # al backend cualquier plantilla con imágenes de tamaño real.
    location ~ ^/api/users/api/v1/certificate-templates/events/[^/]+(/legacy)?$ {
        client_max_body_size 7m;
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
    }

    # Campana de notificaciones (SSE): mismo motivo que doubts/topics arriba -- la conexión
    # queda abierta empujando eventos, así que necesita buffering apagado y timeout largo.
    # Sin esta location dedicada, caía en el bloque genérico /api/users de abajo (60s, con
    # buffering), y nginx cortaba la conexión con 504 Gateway Time-out apenas pasaban 60s
    # sin datos nuevos (bug reportado 2026-08-12).
    location ~ ^/api/users/api/v1/notifications/stream$ {
        rewrite ^/api/users(/.*)$ $1 break;
        proxy_pass http://insightbloom-users:8081;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/users {
        rewrite ^/api/users(/.*)$ $1 break;
        rewrite ^/api/users$      /  break;
        proxy_pass http://insightbloom-users:8081;
    }

    location /api/ingest {
        rewrite ^/api/ingest(/.*)$ $1 break;
        rewrite ^/api/ingest$      /  break;
        proxy_pass http://insightbloom-ingest:8082;
    }

    # Nubes de dudas/temas en vivo (SSE): la conexión queda abierta indefinidamente
    # empujando eventos, así que hay que apagar el buffering de nginx y extender el
    # timeout (si no, el navegador nunca recibe nada hasta que nginx decida cortar).
    location ~ ^/api/query/.*/cloud/(doubts|topics)/stream$ {
        rewrite ^/api/query(/.*)$ $1 break;
        proxy_pass http://insightbloom-query:8083;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/query {
        rewrite ^/api/query(/.*)$ $1 break;
        rewrite ^/api/query$      /  break;
        proxy_pass http://insightbloom-query:8083;
    }

    location /api/moderation {
        rewrite ^/api/moderation(/.*)$ $1 break;
        rewrite ^/api/moderation$      /  break;
        proxy_pass http://insightbloom-moderation:8084;
    }

    location /api/survey {
        rewrite ^/api/survey(/.*)$ $1 break;
        rewrite ^/api/survey$      /  break;
        proxy_pass http://insightbloom-survey:8086;
    }

    location ^~ /api/presentations {
        client_max_body_size 200m;
        # Los bundles de Slidev incluyen módulos y bootstrap inline. La CSP del
        # SPA no puede intersectarse con la del presenter porque bloquearía su
        # ejecución (Firefox lo reporta como un fallo de carga del módulo).
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://insightbloom.v1.rafex.cloud; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' https: wss:" always;
        # El servicio entrega estos archivos sin comprimir y nginx comprime
        # únicamente los tipos textuales definidos arriba. Así evitamos que
        # upstream y proxy negocien/mezclen Content-Encoding y Content-Length,
        # causa del NS_ERROR_CORRUPTED_CONTENT observado en Firefox.
        gzip on;
        gzip_proxied any;
        proxy_set_header Accept-Encoding "";
        rewrite ^/api/presentations(/.*)$ $1 break;
        rewrite ^/api/presentations$      /  break;
        proxy_pass http://insightbloom-presentations:8091;
        # Sincronización en vivo de slides (WebSocket): upgrade + timeout largo,
        # ya que la conexión puede quedar inactiva entre cambios de slide.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Publicación temporal de workspaces auditados. El servicio de presentaciones
    # conserva la validación de publicación, TTL, revocación y CSP específica del
    # artefacto; nginx solo mantiene el mismo host de entrada y reenvía /p/.
    location ^~ /p/ {
        # Los previews son sitios estáticos auditados que pueden incluir
        # <script> inline. La CSP global de la SPA no debe combinarse con la
        # CSP emitida por insightbloom-presentations: dos encabezados CSP se
        # intersectan y terminan bloqueando el JavaScript aunque el HTML y
        # sus assets tengan el MIME correcto.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'self' https://insightbloom.v1.rafex.cloud; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=()' always;
        proxy_pass http://insightbloom-presentations:8091;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ── PWA: el service worker y el manifest deben revalidarse en cada carga
    #    (si no, el navegador nunca detecta actualizaciones del SW). Van antes
    #    de la regla genérica de assets porque nginx prioriza match exacto.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Caché de assets estáticos (Vite hashea los nombres de archivo) ───────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Vista previa de conferencias para crawlers de redes sociales ─────────
    location ~ ^/c/(?<friendly_id>[^/]+)(/.*)?$ {
        if ($is_social_bot) {
            proxy_pass http://insightbloom-presentations:8091/api/v1/share/$friendly_id;
        }
        try_files /index.html /index.html;
    }

    # ── Vista previa del EVENTO público (descripción + flyer propios del evento,
    #    no del deck de slides) para crawlers de redes sociales ──────────────
    location ~ ^/events/(?<event_friendly_id>[^/]+)(/.*)?$ {
        if ($is_social_bot) {
            proxy_pass http://insightbloom-presentations:8091/api/v1/share-event/$event_friendly_id;
        }
        try_files /index.html /index.html;
    }

    # ── SPA catch-all (Vue Router en modo history) ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
